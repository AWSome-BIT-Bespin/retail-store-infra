apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: retail-parameter-store
  namespace: retail-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: eso-secrets-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: retail-secrets-manager
  namespace: retail-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: eso-secrets-reader