name: Terraform Plan
run-name: Terraform ${{ inputs.environment }} Plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '대상 환경'
        type: choice
        default: stg
        options: [dev, stg, prod]
      operation:
        description: '확인할 작업 (apply: 변경 계획 / destroy: 삭제 계획)'
        type: choice
        default: apply
        options: [apply, destroy]

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-aws-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_WORKSPACE: default
  TG_NON_INTERACTIVE: 'true'
  TG_TF_PATH: terraform
  TG_DOWNLOAD_DIR: ${{ github.workspace }}/.terragrunt-ci/${{ inputs.environment }}
  TARGET_ENV: ${{ inputs.environment }}
  PROD_CART_TABLE_ARN: ${{ vars.PROD_CART_TABLE_ARN }}
  PROD_ESO_SECRET_ARNS: ${{ vars.PROD_ESO_SECRET_ARNS }}
  PROD_ESO_PARAMETER_ARNS: ${{ vars.PROD_ESO_PARAMETER_ARNS }}
  PLAN_OPERATION: ${{ inputs.operation }}
  AWS_PLAN_ROLE_ARN: ${{ (inputs.environment == 'dev' && vars.AWS_PLAN_ROLE_ARN_DEV) || (inputs.environment == 'stg' && (vars.AWS_PLAN_ROLE_ARN_STG || vars.AWS_PLAN_ROLE_ARN)) || (inputs.environment == 'prod' && vars.AWS_PLAN_ROLE_ARN_PROD) || '' }}

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: live/aws/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 실행 값 확인
        working-directory: .
        env:
          AWS_ROLE_ARN: ${{ env.AWS_PLAN_ROLE_ARN }}
        run: |
          case "$TARGET_ENV" in dev|stg|prod) ;; *) exit 1 ;; esac
          case "$PLAN_OPERATION" in apply|destroy) ;; *) exit 1 ;; esac
          test -n "$AWS_ROLE_ARN" || { echo '선택한 환경의 AWS Role ARN을 등록하세요.'; exit 1; }
          if [[ "$TARGET_ENV" == prod ]]; then
            : "${PROD_CART_TABLE_ARN:?prod Cart 테이블 ARN을 등록하세요.}"
            : "${PROD_ESO_SECRET_ARNS:?prod Secret ARN JSON 배열을 등록하세요.}"
            : "${PROD_ESO_PARAMETER_ARNS:?prod SSM ARN JSON 배열을 등록하세요.}"
          fi

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.16.1'
          terraform_wrapper: false

      - uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3
        with:
          tg_version: '1.1.6'
          tf_path: terraform

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ env.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: '350606136784'

      - name: 초기화 및 구성 검사
        run: |
          terragrunt run -- init -reconfigure -input=false -lockfile=readonly
          terragrunt run -- validate -no-color

      - name: 변경 또는 삭제 계획 확인
        run: |
          args=()
          if [[ "$PLAN_OPERATION" == destroy ]]; then args+=(-destroy); fi
          terragrunt run -- plan "${args[@]}" -input=false -no-color -lock-timeout=5m
