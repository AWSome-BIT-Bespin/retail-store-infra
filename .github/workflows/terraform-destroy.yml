name: Terraform Destroy
run-name: Terraform ${{ inputs.environment }} Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '대상 환경'
        type: choice
        default: stg
        options: [dev, stg, prod]
      confirmation:
        description: 'DESTROY 선택한환경 INCLUDING RDS 입력 (예: DESTROY stg INCLUDING RDS)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-aws-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_WORKSPACE: default
  TG_NON_INTERACTIVE: 'true'
  TG_TF_PATH: terraform
  TG_DOWNLOAD_DIR: ${{ github.workspace }}/.terragrunt-ci/${{ inputs.environment }}
  TARGET_ENV: ${{ inputs.environment }}

jobs:
  destroy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # GitHub Environment의 팀장 승인 후 job이 시작됩니다.
    environment: aws-${{ inputs.environment }}-destroy
    defaults:
      run:
        shell: bash
        working-directory: live/aws/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 실행 값 확인
        working-directory: .
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          case "$TARGET_ENV" in dev|stg|prod) ;; *) exit 1 ;; esac
          test "$CONFIRMATION" = "DESTROY $TARGET_ENV INCLUDING RDS" || { echo "삭제 확인 문구가 일치하지 않습니다."; exit 1; }
          test -n "$AWS_ROLE_ARN" || { echo '선택한 환경의 AWS Role ARN을 등록하세요.'; exit 1; }

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.16.1'
          terraform_wrapper: false

      - uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3
        with:
          tg_version: '1.1.6'
          tf_path: terraform

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: '350606136784'

      - name: 초기화 및 구성 검사
        run: |
          terragrunt run -- init -reconfigure -input=false -lockfile=readonly
          terragrunt run -- validate -no-color

      - name: 승인 후 새 계획 생성 및 삭제
        run: |
          umask 077
          terragrunt run -- plan -destroy -input=false -no-color -lock-timeout=5m -out="$RUNNER_TEMP/tfplan"
          terragrunt run -- apply -input=false -no-color -lock-timeout=5m "$RUNNER_TEMP/tfplan"
